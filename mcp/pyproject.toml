[project]
name = "visitorstracker-mcp"
version = "0.1.0"
description = "MCP server for the appointment calendars of the Landratsamt Alb-Donau-Kreis and the Stadt Ehingen"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "mcp>=2.3,<3",
]

[project.scripts]
visitorstracker-mcp = "visitorstracker_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visitorstracker_mcp"]
